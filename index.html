<!DOCTYPE html>
<html>
<head>
  <title>Bangalore House Price Predictor</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #1e3c72, #2a5298);
      color: white;
    }

    header {
      text-align: center;
      padding: 30px;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      background: white;
      color: black;
      width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      animation: slideUp 0.8s ease;
    }

    label {
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    input[type="range"] {
      accent-color: #2a5298;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2a5298;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1e3c72;
      transform: scale(1.05);
    }

    #price {
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      color: green;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<header>🏠 Bangalore House Price Predictor</header>

<div class="container">

  <label>Location</label>
  <select>
    <option>Indiranagar</option>
    <option>Whitefield</option>
    <option>Electronic City</option>
  </select>

  <label>Square Feet</label>
  <input type="range" min="500" max="5000">

  <label>BHK</label>
  <input type="number" placeholder="Enter BHK">

  <button onclick="predict()">Predict Price</button>

  <div id="price"></div>

</div>

<script>
function predict() {
  document.getElementById("price").innerHTML =
    "Estimated Price: ₹80 Lakhs (Demo)";
}
</script>

</body>
</html>
